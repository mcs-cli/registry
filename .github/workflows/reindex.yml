name: Reindex & Validate

# Two sequential steps with one writer each: the Worker's reindex refreshes repository
# metadata (stars, branch, tag, pushedAt, unavailable), then scripts/validate.ts records each
# pack's verdict (active/invalid, warnings, validationErrors) — the same checks as submit.
on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:
    inputs:
      force:
        description: "Revalidate every pack (skip the unchanged-pack optimization)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: reindex-validate
  cancel-in-progress: false

jobs:
  reindex-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Reindex metadata
        run: |
          REINDEX_URL="${{ secrets.REGISTRY_URL }}/api/reindex"
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.REINDEX_SECRET }}" \
            "$REINDEX_URL")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "$body" | jq . 2>/dev/null || echo "$body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Reindex failed with status $http_code"
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ❌ Reindex Failed

          **HTTP Status:** $http_code

          \`\`\`
          $body
          \`\`\`
          EOF
            exit 1
          fi

          # Parse response fields
          total=$(echo "$body" | jq -r '.total // 0')
          updated=$(echo "$body" | jq -r '.updated // 0')
          unchanged=$(echo "$body" | jq -r '.unchanged // 0')
          unavailable=$(echo "$body" | jq -r '.unavailable // 0')
          skipped=$(echo "$body" | jq -r '.skipped // 0')
          removed=$(echo "$body" | jq -r '.removed // 0')
          errors=$(echo "$body" | jq -r '.errors // []')
          error_count=$(echo "$errors" | jq -r 'length')

          # Status emoji
          if [ "$error_count" != "0" ] || [ "$unavailable" != "0" ]; then
            status_icon="⚠️"
          else
            status_icon="✅"
          fi

          # Build summary
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## $status_icon Metadata Reindex Report

          | Metric | Count |
          |--------|-------|
          | Total packs | $total |
          | Updated | $updated |
          | Unchanged | $unchanged |
          | Unavailable | $unavailable |
          | Skipped (GitHub gave no answer) | $skipped |
          | Pruned (unavailable) | $removed |
          | Errors | $error_count |
          EOF

          # Add errors detail if any
          if [ "$error_count" != "0" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Errors" >> "$GITHUB_STEP_SUMMARY"
            echo "$errors" | jq -r '.[] | "- \(.)"' >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Reindex completed with $error_count errors"
          fi

          # Add warnings for unavailable / skipped
          if [ "$unavailable" != "0" ]; then
            echo "::warning::$unavailable pack(s) are unavailable"
          fi
          if [ "$skipped" != "0" ]; then
            echo "::warning::$skipped pack(s) skipped: GitHub did not say whether the repo exists"
          fi

          # Hard fail on errors so an aborted reindex doesn't pass as silent success.
          if [ "$error_count" != "0" ]; then
            echo "::error::Reindex returned $error_count error(s)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate packs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REINDEX_SECRET: ${{ secrets.REINDEX_SECRET }}
          FORCE_ALL: ${{ inputs.force }}
        run: npx tsx scripts/validate.ts
